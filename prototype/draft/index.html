<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unrecoder draft</title>
<style>
  :root { --bg: #efe9dc; --paper: #fbf8f1; --ink: #1f1d1a; --muted: #8a8478; --line: #d8d0bf; --pick: #2f5d8a; --ok: #2e7d4f; --bad: #c0392b; --same: #e9e1cf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 "Courier New", monospace; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 3px; }
  header .score { color: var(--muted); }
  .hint { color: var(--muted); margin: -8px 0 0; }
  .sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; }

  .text { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px; user-select: none; }
  .word { display: inline-flex; align-items: flex-end; gap: 2px; padding: 2px 3px; border-radius: 4px; }
  .word.locked { background: #e4efdf; }
  .word.miss { animation: miss .7s; }
  @keyframes miss { 0%, 60% { background: var(--bad); } }
  .stop { font-size: 24px; margin-left: 2px; }

  .g { display: inline-flex; flex-direction: column; align-items: center; cursor: pointer; border-radius: 3px; padding: 2px 1px 0; }
  .g svg { height: 40px; display: block; }
  .g svg * { stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: square; }
  .g svg .dot { fill: var(--ink); stroke: none; }
  .g b { display: block; width: 22px; height: 24px; margin-top: 3px; text-align: center; font-size: 19px; line-height: 22px; border-bottom: 2px solid var(--line); color: var(--pick); font-weight: normal; }
  .g b.conf { color: var(--ink); font-weight: bold; border-bottom-color: transparent; }
  .g.same { background: var(--same); }
  .g.cur { background: var(--pick); }
  .g.cur svg * { stroke: #fff; } .g.cur svg .dot { fill: #fff; stroke: none; }
  .g.cur b { color: #fff; border-bottom-color: #fff; }
  .g.fixed { cursor: default; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bar button, .over button { font: inherit; font-size: 18px; padding: 8px 22px; cursor: pointer; border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; letter-spacing: 2px; }
  .bar button:hover { background: #fff; }
  .bar .note { color: var(--muted); }

  .abc { display: grid; gap: 10px; }
  .abc .row { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .abc .pair { display: inline-flex; gap: 1px; }
  .abc .g svg { height: 30px; }
  .abc .g b { height: 20px; font-size: 16px; line-height: 18px; }
  .abc.bump { animation: bump .3s; }
  @keyframes bump { 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }

  .flash { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 40px; letter-spacing: 6px; color: var(--ok); opacity: 0; }
  .flash.on { animation: flash 1.1s ease-out; }
  @keyframes flash { 20% { opacity: 1; } 100% { opacity: 0; } }
  .points { display: inline-block; margin-left: 12px; padding: 2px 10px; border: 2px solid var(--ink); color: var(--ink); font-size: 18px; border-radius: 4px; }
  .points.hit { animation: hit .6s; }
  @keyframes hit { 0%, 50% { background: var(--bad); color: #fff; border-color: var(--bad); } }
  .points.gain { animation: gain .8s; }
  @keyframes gain { 0%, 50% { background: var(--ok); color: #fff; border-color: var(--ok); } }
  .over { position: fixed; inset: 0; background: rgba(31, 29, 26, .55); display: grid; place-items: center; }
  .over[hidden] { display: none; }
  .over > div { background: var(--paper); padding: 28px 36px; border-radius: 6px; text-align: center; }
  .over h2 { margin: 0 0 8px; letter-spacing: 4px; }
</style>
</head>
<body>
<main>
  <header><h1>UNRECODER · DRAFT</h1><div class="score"><span id="score"></span> <b class="points" id="points"></b></div></header>
  <p class="hint" id="hint">Клик по знаку, затем буква с клавиатуры: она встанет под этот знак везде. Никто не скажет, верна ли она. ОТПРАВИТЬ проверяет дописанные слова: каждое неверное стоит очко.</p>
  <div class="sheet"><div class="text" id="text"></div></div>
  <div class="bar"><span class="note" id="note"></span><button id="send">ОТПРАВИТЬ</button></div>
  <div class="sheet"><div class="abc" id="abc"></div></div>
</main>
<div class="flash" id="flash"></div>
<div class="over" id="over" hidden><div><h2>СВЯЗЬ ПОТЕРЯНА</h2><p id="overText"></p><button id="again">ЗАНОВО</button></div></div>
<script>
// A bare draft of the core. An intercept is written in an invented script: one sign for each Russian letter. A few
// signs are known from the start. The player reads what can be read, guesses the words, and writes a letter under a
// sign: it goes under that sign everywhere. Nothing says whether a letter is right; a wrong one quietly spoils other
// words. Sending checks the words written in full: a right one is confirmed with its letters, a wrong one costs a point. The alphabet
// stays from message to message. At zero points the link is lost.

const START_POINTS = 10;
const COST_WORD = 1; // each word sent wrong; unfinished words are not sent
const REWARD = 4; // a message decoded in full
const START_KNOWN = 'оеатнр'; // the signs known from the start

const WHO = ['курьер', 'резидент', 'связной', 'радист', 'агент', 'шофёр', 'наблюдатель', 'информатор', 'шифровальщик', 'незнакомец'];
const ACTION = ['оставил пакет', 'забрал пакет', 'ждал напрасно', 'сжёг бумаги', 'заметил слежку', 'ушёл от хвоста', 'сменил маршрут', 'передал плёнку',
  'пропустил встречу', 'перешёл границу'];
const PLACE = ['в гавани', 'на вокзале', 'у посольства', 'на мосту', 'в гостинице', 'на рынке', 'у церкви', 'на аэродроме', 'на складе', 'в кафе', 'в парке', 'на почте'];
const STATE = ['явка провалена', 'он арестован', 'он ранен', 'он цел', 'за ним следят', 'всё тихо', 'дом под охраной', 'связь потеряна'];
const RESULT = ['ждём указаний', 'просим эвакуацию', 'уходим в тишину', 'встреча отменена', 'нужны новые документы', 'нужны деньги', 'переходим на запасной канал',
  'никого не присылать', 'операция продолжается', 'следующая связь через два дня'];

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const restart = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }; // replay a CSS animation

// ---------- the script ----------
// Paired sounds share a shape, and the voiced one carries a bar across the stem: п/б, т/д, к/г, с/з, ш/ж, ф/в; щ is a
// marked ч. Vowels have no stem and pair the same way with a dot: а/я, о/ё, у/ю, э/е, ы/и. One sign is a clue to its pair.

const CONS = { п: [0, 0], б: [0, 1], т: [1, 0], д: [1, 1], к: [2, 0], г: [2, 1], с: [3, 0], з: [3, 1], ш: [4, 0], ж: [4, 1], ф: [5, 0], в: [5, 1],
  м: [6, 0], н: [7, 0], л: [8, 0], р: [9, 0], х: [10, 0], ц: [11, 0], ч: [12, 0], щ: [12, 1], й: [13, 0] };
const VOW = { а: [0, 0], я: [0, 1], о: [1, 0], ё: [1, 1], у: [2, 0], ю: [2, 1], э: [3, 0], е: [3, 1], ы: [4, 0], и: [4, 1] };
const SIGN = { ь: 0, ъ: 1 };
const C_SHAPE = [
  [[10, 2, 18, 2]], [[2, 2, 18, 2]], [[10, 15, 18, 6], [10, 15, 18, 24]], [[10, 2, 18, 10]], [[10, 10, 18, 2], [10, 19, 18, 11]],
  [[10, 8, 17, 14], [17, 14, 10, 20], [10, 8, 3, 14], [3, 14, 10, 20]], [[10, 2, 2, 12], [10, 2, 18, 12]], [[3, 14, 17, 14]],
  [[10, 28, 2, 18]], [[10, 2, 18, 8], [18, 8, 10, 14]], [[3, 8, 17, 20], [17, 8, 3, 20]], [[10, 28, 18, 28], [18, 28, 18, 21]],
  [[10, 16, 2, 6], [10, 16, 18, 6]], [[10, 14, 18, 14], [18, 14, 18, 26]],
];
const V_SHAPE = [
  [[3, 21, 10, 11], [10, 11, 17, 21]], [[10, 9, 17, 16], [17, 16, 10, 23], [10, 23, 3, 16], [3, 16, 10, 9]],
  [[3, 11, 10, 21], [10, 21, 17, 11]], [[16, 9, 4, 16], [4, 16, 16, 23]], [[4, 9, 16, 16], [16, 16, 4, 23]],
];
const strokes = (segs) => segs.map(([a, b, c, d]) => `<path d="M${a} ${b}L${c} ${d}"/>`).join('');
function sign(ch) {
  let w = 20, body;
  if (ch in CONS) { const [i, v] = CONS[ch]; body = strokes([[10, 2, 10, 28], ...C_SHAPE[i], ...(v ? [[5, 24, 15, 24]] : [])]); }
  else if (ch in VOW) { const [i, v] = VOW[ch]; body = strokes(V_SHAPE[i]) + (v ? '<circle class="dot" cx="10" cy="3" r="2"/>' : ''); }
  else { w = 12; body = strokes([[6, 19, 6, 28], ...(SIGN[ch] ? [[2, 19, 10, 19]] : [])]); }
  return `<svg viewBox="0 0 ${w} 32">${body}</svg>`;
}
// The player's table of signs, pairs side by side. The order of the pairs is not the order of the alphabet.
const ABC = [['тд', 'шж', 'пб', 'фв', 'кг', 'сз', 'чщ'], ['р', 'х', 'м', 'й', 'ц', 'л', 'н'], ['ую', 'ая', 'ыи', 'оё', 'эе', 'ь', 'ъ']];

// ---------- state ----------

let confirmed; // letters whose signs are known for sure
let guess; // sign (named by its true letter) -> the letter the player wrote under it
let msg; // {words: [{text, stop, locked, miss}], spots: [{w, ch}]}
let sel = null; // the sign picked, by its true letter
let spot = -1; // and where in the message it was picked, to step on from there
let score;
let busy = false;

const shown = (ch) => (confirmed.has(ch) ? ch : guess[ch] || '');

function newMessage() {
  const text = `${pick(WHO)} ${pick(ACTION)} ${pick(PLACE)}. ${pick(STATE)}. ${pick(RESULT)}.`;
  const words = text.split(' ').map((t) => ({ text: t.replace('.', ''), stop: t.endsWith('.'), locked: false }));
  msg = { words, spots: words.flatMap((w, k) => [...w.text].map((ch) => ({ w: k, ch }))) };
  lockRead();
  busy = false;
  sel = null;
  spot = -1;
  render();
}

/** A word made only of signs known for sure needs no sending. */
function lockRead() { for (const w of msg.words) if ([...w.text].every((ch) => confirmed.has(ch))) w.locked = true; }

function select(ch, at) {
  if (busy || confirmed.has(ch)) return;
  sel = ch;
  spot = at;
  render();
}

/** Write `letter` under the sign picked. A letter sits under one sign only. */
function write(letter) {
  if (busy || sel === null) return;
  if (confirmed.has(letter)) return restart($('abc'), 'bump'); // that letter's sign is known, and it is another one
  for (const k of Object.keys(guess)) if (guess[k] === letter) delete guess[k];
  guess[sel] = letter;
  for (let n = 1; n <= msg.spots.length && spot >= 0; n++) { // step on to the next sign with nothing under it
    const p = (spot + n) % msg.spots.length;
    if (!shown(msg.spots[p].ch)) { sel = msg.spots[p].ch; spot = p; break; }
  }
  render();
}

function erase() {
  if (busy || sel === null) return;
  delete guess[sel];
  render();
}

function step(by) {
  if (busy || spot < 0) return;
  for (let n = 1; n <= msg.spots.length; n++) {
    const p = (spot + by * n + msg.spots.length * n) % msg.spots.length;
    if (!confirmed.has(msg.spots[p].ch)) { sel = msg.spots[p].ch; spot = p; break; }
  }
  render();
}

/** Check the words written in full. Right ones are confirmed with their letters; each wrong one costs. */
function send() {
  if (busy) return;
  let wrong = 0;
  for (const w of msg.words) {
    if (w.locked || ![...w.text].every(shown)) continue; // an unfinished word is not sent
    if ([...w.text].every((ch) => shown(ch) === ch)) {
      w.locked = true;
      for (const ch of w.text) { confirmed.add(ch); delete guess[ch]; }
    } else { wrong += 1; w.miss = true; }
  }
  lockRead();
  sel = null;
  spot = -1;
  if (wrong) {
    score.points -= wrong * COST_WORD;
    render();
    restart($('points'), 'hit');
    if (score.points <= 0) {
      busy = true;
      $('overText').textContent = `Сообщений расшифровано: ${score.messages}. Знаков известно: ${confirmed.size} из 33.`;
      $('over').hidden = false;
    }
    return;
  }
  if (!msg.words.every((w) => w.locked)) return render();
  score.messages += 1;
  score.points += REWARD;
  busy = true;
  render();
  restart($('points'), 'gain');
  $('flash').textContent = `ПРИНЯТО +${REWARD}`;
  restart($('flash'), 'on');
  setTimeout(newMessage, 1400);
}

function newGame() {
  confirmed = new Set(START_KNOWN);
  guess = {};
  score = { messages: 0, points: START_POINTS };
  $('over').hidden = true;
  newMessage();
}

// ---------- drawing ----------

function signEl(ch, at) {
  const fixed = confirmed.has(ch);
  const g = el('span', { className: 'g' + (fixed ? ' fixed' : '') + (sel === ch ? (at === spot ? ' cur' : ' same') : ''), innerHTML: sign(ch) });
  g.append(el('b', { textContent: shown(ch), className: fixed ? 'conf' : '' }));
  g.onclick = () => select(ch, at);
  return g;
}

function render() {
  $('score').textContent = `сообщений ${score.messages}`;
  $('points').textContent = `ОЧКИ ${Math.max(0, score.points)}`;
  $('points').classList.remove('hit', 'gain');
  $('hint').hidden = score.messages > 0;
  $('note').textContent = `знаков известно ${confirmed.size} из 33`;

  let at = 0;
  $('text').replaceChildren(...msg.words.map((w) => {
    const span = el('span', { className: 'word' + (w.locked ? ' locked' : '') + (w.miss ? ' miss' : '') });
    w.miss = false;
    for (const ch of w.text) span.append(signEl(ch, at++));
    if (w.stop) span.append(el('span', { className: 'stop', textContent: '.' }));
    return span;
  }));

  $('abc').replaceChildren(...ABC.map((row) => {
    const div = el('div', { className: 'row' });
    for (const pair of row) {
      const p = el('span', { className: 'pair' });
      for (const ch of pair) p.append(signEl(ch, -1));
      div.append(p);
    }
    return div;
  }));
}

// The letter keys by where they sit, so typing works in the English layout too.
const KEYS = { KeyQ: 'й', KeyW: 'ц', KeyE: 'у', KeyR: 'к', KeyT: 'е', KeyY: 'н', KeyU: 'г', KeyI: 'ш', KeyO: 'щ', KeyP: 'з', BracketLeft: 'х', BracketRight: 'ъ',
  KeyA: 'ф', KeyS: 'ы', KeyD: 'в', KeyF: 'а', KeyG: 'п', KeyH: 'р', KeyJ: 'о', KeyK: 'л', KeyL: 'д', Semicolon: 'ж', Quote: 'э',
  KeyZ: 'я', KeyX: 'ч', KeyC: 'с', KeyV: 'м', KeyB: 'и', KeyN: 'т', KeyM: 'ь', Comma: 'б', Period: 'ю', Backquote: 'ё' };
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const letter = /^[а-яё]$/.test(key) ? key : KEYS[e.code];
  if (letter) { e.preventDefault(); return write(letter); }
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); return erase(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); return step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); return step(1); }
  if (e.key === 'Escape') { sel = null; spot = -1; render(); }
});
$('send').onclick = send;
$('again').onclick = newGame;
newGame();
</script>
</body>
</html>
