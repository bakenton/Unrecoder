<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unrecoder: наброски письма</title>
<style>
  :root { --bg: #efe9dc; --paper: #fbf8f1; --ink: #1f1d1a; --muted: #8a8478; --line: #d8d0bf; --pick: #2f5d8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 "Courier New", monospace; }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 3px; }
  section { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; display: grid; gap: 14px; }
  h2 { margin: 0; font-size: 15px; letter-spacing: 2px; }
  h3 { margin: 0 0 2px; font-size: 12px; font-weight: normal; color: var(--muted); letter-spacing: 1px; }
  .line { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 3px; }
  .g { display: inline-flex; flex-direction: column; align-items: center; }
  .g svg { height: 46px; display: block; }
  .g.small svg { height: 34px; }
  .g span { font-size: 14px; height: 18px; color: var(--pick); font-weight: bold; }
  .g span.no { color: var(--line); }
  .sp { width: 20px; } .gap { width: 14px; }
  svg * { stroke: var(--ink); stroke-width: 2.2; fill: none; }
  svg .dot { fill: var(--ink); stroke: none; }
  svg .hole { fill: var(--line); stroke: none; }
</style>
</head>
<body>
<main>
  <h1>НАБРОСКИ ПИСЬМА</h1>
  <div id="out" style="display: grid; gap: 16px;"></div>
</main>
<script>
// Three looks for one invented script. The logic under all three is Russian: a letter is a sign, paired sounds share a
// shape (the voiced one carries a mark: п/б, т/д, к/г, с/з, ш/ж, ф/в; щ is a marked ч), and so do vowels (а/я, о/ё,
// у/ю, э/е, ы/и: the second carries a dot). Knowing one sign of a pair is a clue to the other.

const CONS = { п: [0, 0], б: [0, 1], т: [1, 0], д: [1, 1], к: [2, 0], г: [2, 1], с: [3, 0], з: [3, 1], ш: [4, 0], ж: [4, 1], ф: [5, 0], в: [5, 1],
  м: [6, 0], н: [7, 0], л: [8, 0], р: [9, 0], х: [10, 0], ц: [11, 0], ч: [12, 0], щ: [12, 1], й: [13, 0] };
const VOW = { а: [0, 0], я: [0, 1], о: [1, 0], ё: [1, 1], у: [2, 0], ю: [2, 1], э: [3, 0], е: [3, 1], ы: [4, 0], и: [4, 1] };
const SIGN = { ь: 0, ъ: 1 };

const lines = (segs, cap = 'square') => segs.map(([a, b, c, d]) => `<path d="M${a} ${b}L${c} ${d}" stroke-linecap="${cap}"/>`).join('');
const curve = (d, dx = 0) => `<path d="${d}" transform="translate(${dx})" stroke-linecap="round" stroke-linejoin="round"/>`;
const dot = (x, y, r = 1.8) => `<circle class="dot" cx="${x}" cy="${y}" r="${r}"/>`;

// ---------- A: a stem with branches ----------

const A_CONS = [
  [[10, 2, 18, 2]], [[2, 2, 18, 2]], [[10, 15, 18, 6], [10, 15, 18, 24]], [[10, 2, 18, 10]], [[10, 10, 18, 2], [10, 19, 18, 11]],
  [[10, 8, 17, 14], [17, 14, 10, 20], [10, 8, 3, 14], [3, 14, 10, 20]], [[10, 2, 2, 12], [10, 2, 18, 12]], [[3, 14, 17, 14]],
  [[10, 28, 2, 18]], [[10, 2, 18, 8], [18, 8, 10, 14]], [[3, 8, 17, 20], [17, 8, 3, 20]], [[10, 28, 18, 28], [18, 28, 18, 21]],
  [[10, 16, 2, 6], [10, 16, 18, 6]], [[10, 14, 18, 14], [18, 14, 18, 26]],
];
const A_VOW = [
  [[3, 21, 10, 11], [10, 11, 17, 21]], [[10, 9, 17, 16], [17, 16, 10, 23], [10, 23, 3, 16], [3, 16, 10, 9]],
  [[3, 11, 10, 21], [10, 21, 17, 11]], [[16, 9, 4, 16], [4, 16, 16, 23]], [[4, 9, 16, 16], [16, 16, 4, 23]],
];
function drawA(ch) {
  if (ch in CONS) { const [i, v] = CONS[ch]; return { w: 20, body: lines([[10, 2, 10, 28], ...A_CONS[i], ...(v ? [[5, 24, 15, 24]] : [])]) }; }
  if (ch in VOW) { const [i, v] = VOW[ch]; return { w: 20, body: lines(A_VOW[i]) + (v ? dot(10, 3, 2) : '') }; }
  return { w: 12, body: lines([[6, 19, 6, 28], ...(SIGN[ch] ? [[2, 19, 10, 19]] : [])]) };
}

// ---------- B: a stem with bows ----------

const B_STEM = ['M5 2L5 24', 'M5 12L5 31', 'M5 12L5 24'];
const B_BOW = ['M5 12C19 12 19 24 5 24', 'M5 17C5 9 17 9 17 17L17 24', 'M5 19C5 27 17 27 17 19L17 12', 'M5 12C12 12 18 14 18 19', 'M5 18C9 9 13 27 18 18'];
const B_VOW = ['M12 18A4 4 0 1 1 4 18A4 4 0 1 1 12 18', 'M12 14C2 11 2 25 12 22', 'M3 14C3 26 13 26 13 14', 'M3 22C3 10 13 10 13 22', 'M2 18C5 9 11 27 14 18'];
function drawB(ch) {
  if (ch in CONS) { const [i, v] = CONS[ch]; const bow = B_BOW[Math.floor(i / 3)]; return { w: v ? 34 : 22, body: curve(B_STEM[i % 3]) + curve(bow) + (v ? curve(bow, 12) : '') }; }
  if (ch in VOW) { const [i, v] = VOW[ch]; return { w: 16, body: curve(B_VOW[i]) + (v ? dot(8, 6) : '') }; }
  return { w: 10, body: dot(5, 28) + (SIGN[ch] ? dot(5, 22) : '') };
}

// ---------- C: punched tape ----------

function drawC(ch) {
  const on = new Set();
  const bits = (n, places) => places.forEach((p, k) => { if (n >> k & 1) on.add(p); });
  if (ch in CONS) { const [i, v] = CONS[ch]; bits(i + 1, ['0,0', '2,0', '0,2', '2,2']); if (v) on.add('1,1'); }
  else if (ch in VOW) { const [i, v] = VOW[ch]; bits(i + 1, ['1,0', '0,1', '2,1']); if (v) on.add('1,2'); }
  else { on.add('1,1'); if (SIGN[ch]) on.add('1,2'); }
  let body = '';
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) body += on.has(`${x},${y}`) ? dot(5 + x * 7, 9 + y * 7, 2.8) : `<circle class="hole" cx="${5 + x * 7}" cy="${9 + y * 7}" r="1"/>`;
  return { w: 24, body };
}

// ---------- the page ----------

const PHRASE = 'курьер ждёт в гавани';
const KNOWN = new Set('кртване');
const PAIRS = 'пб тд кг сз шж фв чщ  ая оё ую эе ыи';

function glyph(draw, ch, under, small) {
  const { w, body } = draw(ch);
  const g = document.createElement('span');
  g.className = 'g' + (small ? ' small' : '');
  g.innerHTML = `<svg viewBox="0 0 ${w} 32">${body}</svg>` + (under === undefined ? '' : `<span class="${under ? '' : 'no'}">${under || '·'}</span>`);
  return g;
}
function line(draw, text, under, small) {
  const div = document.createElement('div');
  div.className = 'line';
  for (const ch of text) {
    if (ch === ' ') { div.append(Object.assign(document.createElement('span'), { className: small ? 'gap' : 'sp' })); continue; }
    div.append(glyph(draw, ch, under && under(ch), small));
  }
  return div;
}
function block(title, node) {
  const d = document.createElement('div');
  d.append(Object.assign(document.createElement('h3'), { textContent: title }), node);
  return d;
}

for (const [name, draw] of [['A · ЗАСЕЧКИ', drawA], ['B · ДУГИ', drawB], ['C · ПЕРФОЛЕНТА', drawC]]) {
  const s = document.createElement('section');
  s.append(
    Object.assign(document.createElement('h2'), { textContent: name }),
    block('перехват', line(draw, PHRASE)),
    block('с неполным алфавитом', line(draw, PHRASE, (ch) => (KNOWN.has(ch) ? ch : ''))),
    block('пары: глухой и звонкий, гласная и йотированная', line(draw, PAIRS, (ch) => ch, true)),
  );
  document.getElementById('out').append(s);
}
</script>
</body>
</html>
