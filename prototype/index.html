<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unrecoder — duty radio table prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desk">
    <section class="panel radio" aria-label="Radio">
      <header>
        <span>EXPEDITION RADIO LOG <b id="txId"></b></span>
        <span id="txTime"></span>
      </header>
      <div class="dump" id="dump" aria-label="Received signal"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section class="panel board" aria-label="Decoding sheet">
      <header>
        <span id="boardTitle">DECODING SHEET</span>
        <span class="intuition" id="intuition" title="Intuition Points"></span>
      </header>
      <div id="picks" class="picks"></div>
      <div id="controls" class="controls"></div>
      <div id="readBox" class="readbox" hidden></div>
      <p class="legend" id="legend"></p>
    </section>

    <section class="panel crew" aria-label="Crew list">
      <header><span>CREW LIST</span><button id="hintBtn" type="button">Hint</button></header>
      <ul id="crewList"></ul>
      <p class="hint" id="hint" hidden></p>
    </section>

    <section class="panel keysheet" aria-label="Key">
      <header>
        <span>KEY FOR THIS TRANSMISSION</span>
        <label class="help"><input type="checkbox" id="helpToggle"> show key (training)</label>
      </header>
      <div id="keyInfo"></div>
    </section>

    <section class="panel map" aria-label="Route map">
      <header><span>ROUTE MAP — GLACIER</span></header>
      <svg id="map" viewBox="0 0 440 290" role="img" aria-label="Route map"></svg>
    </section>

    <section class="panel table-sheet" aria-label="Duty radio table">
      <header><span>DUTY RADIO TABLE — row digit + column digit = cell number</span></header>
      <div id="codeTable"></div>
    </section>

    <section class="panel orders" aria-label="Orders">
      <header><span>ORDERS (CHOOSE 1 OF 5)</span></header>
      <div class="order-row" id="orders"></div>
      <button id="sendBtn" type="button" class="send" disabled>TRANSMIT ORDER</button>
    </section>

    <section class="panel result" id="result" aria-label="Next transmission" hidden>
      <header><span>NEXT TRANSMISSION</span><span id="resultTime"></span></header>
      <p class="message" id="message"></p>
      <div class="debrief" id="debrief"></div>
      <div class="result-actions">
        <button id="nextBtn" type="button" class="send">NEXT TRANSMISSION ▸</button>
        <button id="restartBtn" type="button">Replay this transmission</button>
        <button id="restartAllBtn" type="button">Restart from the first</button>
      </div>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
